<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#444"/></marker></defs><rect width="1400" height="600" fill="white"/><text x="700.0" y="48.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#222">RQ1: Representation comparison</text><text x="700.0" y="85.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#222">Same classifier family; fitted separately for each configuration</text><rect x="35" y="251" width="180" height="88" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="125.0" y="287.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#222">Comment</text><text x="125.0" y="316.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#222">Cleaned text</text><rect x="310" y="120" width="550" height="120" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="585.0" y="158.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#222">Word-level TF-IDF</text><text x="585.0" y="187.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#222">Unigrams + bigrams</text><text x="585.0" y="216.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#222">1 configuration</text><rect x="300" y="337" width="570" height="180" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><text x="585.0" y="366.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#222">Dense branch: 5 × 6 = 30 configurations</text><rect x="320" y="390" width="310" height="108" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="475.0" y="420.95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#222">Pretrained embeddings (frozen)</text><text x="475.0" y="449.95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#222">FastText · GloVe · Word2Vec</text><text x="475.0" y="478.95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#222">LexVec · BPEmb</text><rect x="690" y="390" width="160" height="108" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="770.0" y="436.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#222">Pooling</text><text x="770.0" y="465.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#222">6 strategies</text><polyline points="630,444 690,444" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><polyline points="215,295 260,295 260,180 310,180" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><polyline points="260,295 260,444 320,444" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="300.5" y="295.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#222">either</text><rect x="1010" y="220" width="350" height="160" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="1185.0" y="278.35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#222">One-vs-Rest</text><text x="1185.0" y="307.35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#222">Logistic Regression</text><text x="1185.0" y="336.35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#222">One binary classifier per label</text><polyline points="860,180 945,180 945,260 1010,260" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><polyline points="850,444 945,444 945,340 1010,340" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="940.0" y="137.95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#222">Sparse</text><text x="940.0" y="166.95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#222">features</text><text x="940.0" y="470.95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#222">Dense</text><text x="940.0" y="499.95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#222">features</text><polyline points="1185,380 1185,425" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="1020" y="425" width="330" height="88" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="1185.0" y="461.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#222">6 label scores</text><text x="1185.0" y="490.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#222">Holdout Macro ROC-AUC</text><text x="700.0" y="572.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#222">The two branches are evaluated separately; their features are not concatenated.</text></svg>