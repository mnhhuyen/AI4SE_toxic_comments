<text x="354" y="185" font-size="16" font-weight="700" fill="#33739f">POOLED-FEATURE CLASSIFIERS</text>
<text x="354" y="224" font-size="23" font-weight="700">Max + supervised attention</text><text x="354" y="255" font-size="18">Pool token embeddings · 600d features</text>
<path d="M720 220H801" fill="none" stroke="#506879" stroke-width="2.5" marker-end="url(#arrow)"/>
