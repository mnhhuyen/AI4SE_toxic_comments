<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">RQ2: three modeling pipelines with FastText inputs</title>
<desc id="desc">Cleaned comments become frozen FastText embeddings. Three alternative pipelines process them: max plus supervised attention pooling followed by LR or LightGBM; bidirectional recurrent encoders followed by max plus learned attention pooling and a classification head; and DPCNN convolutional residual blocks followed by a classification head. All produce six label scores evaluated on five folds. Pooled baseline experiments are in progress.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506879"/></marker></defs>
